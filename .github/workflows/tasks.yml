# COPY of .github/workflows/tasks.yml (the owner pastes it once). Runs every task file added to
# ci/tasks/ on main; each task ends as a PR whose body is its report. Logic: tools/wfa/tasks.py.
name: tasks
on:
  push:
    branches: [main]
    paths: ['ci/tasks/**']
  workflow_dispatch:
    inputs:
      only:
        description: task id to run again (file name without .json)
        required: true
permissions:
  contents: read
concurrency:
  group: tasks
  cancel-in-progress: false
jobs:
  tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WOWFA_BOT_TOKEN }}
          fetch-depth: 0
      - name: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: run tasks
        env:
          BOT_TOKEN: ${{ secrets.WOWFA_BOT_TOKEN }}
          ONLY: ${{ inputs.only }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$ONLY" ]; then
            python3 tools/ci.py tasks --only "$ONLY"
          else
            python3 tools/ci.py tasks --since "$BEFORE"
          fi
